name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sync_agents.py --check
      - run: python -m build
      - name: Install built wheel and smoke test CLI
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          rolesync --version
          TMP_ROOT="$(python -c 'import tempfile; print(tempfile.mkdtemp())')"
          rolesync init "$TMP_ROOT/project" --preset minimal --platform both
          rolesync check --root "$TMP_ROOT/project"
          rolesync doctor --root "$TMP_ROOT/project" || test $? -eq 1
          rolesync init "$TMP_ROOT/github-project" --preset github-workflow --platform both
          rolesync check --root "$TMP_ROOT/github-project"
          test ! -e "$TMP_ROOT/github-project/.claude/agents/example-deep-rescue.md"
          test ! -e "$TMP_ROOT/github-project/.codex/agents/example-deep-rescue.toml"
